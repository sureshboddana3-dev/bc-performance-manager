<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bcpm-bg: #EAF1F7; }
  html, body { margin: 0; padding: 0; background: var(--bcpm-bg); }
  #root { min-height: 100vh; }
  @keyframes bcpm-spin { to { transform: rotate(360deg); } }
  @keyframes bcpm-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.75; } }
</style>
</head>
<body>
<div id="root">
  <div id="bcpm-loading" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#5B6154;gap:14px;padding:24px;text-align:center;">
    <div style="width:34px;height:34px;border:3px solid #DCE4EF;border-top-color:#2E5EA3;border-radius:50%;animation:bcpm-spin 0.9s linear infinite;"></div>
    <div>Loading BC Performance Manager...</div>
    <div style="font-size:12px;opacity:0.7;max-width:320px;">If this stays on screen for more than ~10 seconds, something failed to load — an error box will appear below.</div>
  </div>
</div>
<div id="bcpm-error-box" style="display:none;max-width:640px;margin:16px auto;padding:16px;border:2px solid #B23A32;border-radius:12px;background:#FAE1DE;color:#7A2E28;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px;white-space:pre-wrap;word-break:break-word;"></div>
<script>
  window.__bcpmShowError = function(msg) {
    var box = document.getElementById("bcpm-error-box");
    if (box) { box.style.display = "block"; box.textContent = "BC Performance Manager failed to start:\n\n" + msg + "\n\nPlease share this exact message so it can be fixed."; }
    var loading = document.getElementById("bcpm-loading");
    if (loading) loading.style.display = "none";
  };
  window.addEventListener("error", function(e) {
    window.__bcpmShowError((e.message || "Unknown script error") + (e.filename ? "\n(" + e.filename + ":" + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function(e) {
    window.__bcpmShowError("Unhandled promise rejection: " + (e.reason && (e.reason.message || e.reason) || "unknown"));
  });
  setTimeout(function() {
    var loading = document.getElementById("bcpm-loading");
    if (loading && loading.style.display !== "none" && !window.__bcpmMounted) {
      window.__bcpmShowError(
        "Still loading after 8 seconds even though the rendering engine is now built " +
        "directly into this page (no network request needed to start). This points to " +
        "a JavaScript error rather than a network problem — please share this message " +
        "plus whatever appears above it."
      );
    }
  }, 8000);
</script>
